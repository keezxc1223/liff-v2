  (function(){
    function $(id){return document.getElementById(id);}
    var msg=$('customMessage'),gift=$('giftSelect');
    var pvMsg=$('pvMsg'),pvGift=$('pvGift');
    function sync(){
      if(pvMsg){var m=(msg&&msg.value)||'';pvMsg.textContent=m||pvMsg.getAttribute('data-default');pvMsg.style.opacity=m?'1':'.6';}
      if(pvGift&&gift){var o=gift.options[gift.selectedIndex];pvGift.textContent=o?o.text:'';}
    }
    ['input','change','keyup'].forEach(function(ev){[msg,gift].forEach(function(el){if(el)el.addEventListener(ev,sync);});});
    if(document.readyState!=='loading')sync();else document.addEventListener('DOMContentLoaded',sync);
  })();
  </script>

                text: "【王品集團】5000元好禮即享券-限定品牌使用(分次使用．無效期)"
            }
        };

        document.getElementById("btnSendGift").addEventListener("click", function () {
            const selectedGift = document.getElementById("giftSelect").value;
            sendShareGift(selectedGift);
        });

            const customMessage = encodeURIComponent(document.getElementById('customMessage').value || '我就是乞丐才會相信');

                    "altText": `${name}送禮物來了，打開看看吧！`,
                    "contents": {
                        "type": "bubble",
                        "size": "kilo",
                        "hero": {
                            "type": "image",
                            "url": (function () {
                                const urls = [
                                    "https://i.imgur.com/iZ472mG.png",
                                    "https://i.imgur.com/SNf3vqJ.png",
                                    "https://i.imgur.com/6bpYyd0.png",
                                    "https://i.imgur.com/z8FzXhv.png"
                                ];
                                return urls[Math.floor(Math.random() * urls.length)];
                            })(),
                            "size": "full",
                            "aspectRatio": "18:19",
                            "aspectMode": "cover",
                            "action": {
                                "type": "uri",
                                "label": "action",
                                "uri": `https://liff.line.me/2006895761-IokpKriZ?auto=yes&type=text&text=${customMessage}`
                            }
                        },
                        "body": {
                            "type": "box",
                            "layout": "horizontal",
                            "spacing": "none",
                            "contents": [
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "contents": [
                                        {
                                            "type": "image",
                                            "url": gift.imageUrl,
                                            "size": "md",
                                            "aspectMode": "cover",
                                            "gravity": "center",
                                            "action": {
                                                "type": "uri",
                                                "label": "action",
                                                "uri": `https://liff.line.me/2006895761-IokpKriZ?auto=yes&type=text&text=${customMessage}`
                                            }
                                        }
                                    ]
                                },
                                {
                                    "type": "text",
                                    "text": gift.text,
                                    "size": "md",
                                    "weight": "bold",
                                    "wrap": true,
                                    "action": {
                                        "type": "uri",
                                        "label": "action",
                                        "uri": `https://liff.line.me/2006895761-IokpKriZ?auto=yes&type=text&text=${customMessage}`
                                    }
                                }
                            ]
                        },
                        "footer": {
                            "type": "box",
                            "layout": "vertical",
                            "contents": [
                                {
                                    "type": "button",
                                    "color": "#F5F5F5",
                                    "style": "secondary",
                                    "action": {
                                        "type": "uri",
                                        "label": "打開我的禮物",
                                        "uri": `https://liff.line.me/2006895761-IokpKriZ?auto=yes&type=text&text=${customMessage}`
                                    }
                                },
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "margin": "sm",
                                    "contents": []
                                },
                                {
                                    "type": "button",
                                    "color": "#F5F5F5",
                                    "style": "secondary",
                                    "action": {
                                        "type": "uri",
                                        "label": "挑選感謝禮物",
                                        "uri": `https://liff.line.me/2006895761-IokpKriZ?auto=yes&type=text&text=${customMessage}`
                                    }
                                },
                                {
                                    "type": "button",
                                    "color": "#000000",
                                    "action": {
                                        "type": "uri",
                                        "label": "傳送感謝小卡",
                                        "uri": `https://liff.line.me/2006895761-IokpKriZ?auto=yes&type=text&text=${customMessage}`
                                    }
                                },
                                {
                                    "type": "separator"
                                },
                                {
                                    "type": "box",
                                    "layout": "vertical",
                                    "margin": "md",
                                    "contents": []
                                },
                                {
                                    "type": "box",
                                    "layout": "baseline",
                                    "contents": [
                                        {
                                            "type": "icon",
                                            "url": "https://i.imgur.com/fQyk1H7.png",
                                            "size": "md",
                                            "scaling": true,
                                            "offsetTop": "xs"
                                        },
                                        {
                                            "type": "text",
                                            "text": "  LINE 禮物",
                                            "size": "xxs",
                                            "color": "#8E8E8E",

            ])
            if (result) {
                alert(`[${result.status}] 禮物發送成功`)
            } else {
                const [majorVer, minorVer, patchVer] = (liff.getLineVersion() || "").split('.')
                if (minorVer === undefined) {
                    alert('ShareTargetPicker was canceled in external browser');
                    return;
                }
                if (parseInt(majorVer) >= 10 && parseInt(minorVer) >= 10 && parseInt(patchVer) > 0) {
                    alert('ShareTargetPicker was canceled in LINE app');
                }
            }
        }

        function logOut() {
            liff.logout();
            window.location.reload()
        }

        function reloadPage() {
            location.reload();
        }

        async function main() {
            await liff.init({ liffId: "2006895761-8m6Qal3y" })
            if (liff.isLoggedIn()) {
                document.getElementById("btnShare").style.display = "block"
                if (!liff.isInClient()) {
                    document.getElementById("btnLogOut").style.display = "block"
                }
            } else {
                document.getElementById("btnLogin").style.display = "block"
            }
        }
        main()
    </script>
